name: emulator-smoke

on:
  push:
  workflow_dispatch:

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests (fake device, no phone needed)
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      - name: Real emulator integration smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: PYTHONPATH=$GITHUB_WORKSPACE python3 ci/emulator_smoke.py
